apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-pipeline-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-pipeline-api
  template:
    metadata:
      labels:
        app: agentic-pipeline-api
    spec:
      containers:
        - name: api
          image: ghcr.io/milad-dark/agentic-pipeline-api:latest
          ports:
            - containerPort: 8080
